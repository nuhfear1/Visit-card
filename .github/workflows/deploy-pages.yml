name: Déployer sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Installer les dépendances
        run: npm install

      - name: Construire le site
        run: npm run build
        env:
          NEXT_PUBLIC_PROJECT_CONVERSATION_ENDPOINT: ${{ vars.NEXT_PUBLIC_PROJECT_CONVERSATION_ENDPOINT }}
          NEXT_PUBLIC_MASTERCLASS_REGISTRATION_ENDPOINT: ${{ vars.NEXT_PUBLIC_MASTERCLASS_REGISTRATION_ENDPOINT }}
          NEXT_PUBLIC_FUNNEL_EVENT_ENDPOINT: ${{ vars.NEXT_PUBLIC_FUNNEL_EVENT_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
